<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="StudyMind AI — a standalone learner dashboard." />
  <title>StudyMind AI</title>
  <style>
    :root{--navy:#12172a;--navy-2:#1d2440;--ink:#172033;--muted:#667085;--line:#e6e9f0;--bg:#f6f7fb;--card:#fff;--purple:#6941c6;--purple-2:#8b5cf6;--blue:#2563eb;--green:#12b76a;--amber:#f79009;--red:#d92d20;--shadow:0 14px 40px rgba(23,32,51,.08);--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.sidebar{width:260px;background:linear-gradient(180deg,var(--navy),#0d1122);color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0;z-index:20;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 12px 26px;font-weight:800;font-size:19px}.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#9b8afb,#5f46ce);display:grid;place-items:center;font-size:20px;box-shadow:0 8px 22px #0004}.brand em{color:#a897ff;font-style:normal}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b8bfd4;text-align:left;padding:12px 14px;border-radius:12px;display:flex;align-items:center;gap:12px;transition:.2s}.nav button:hover,.nav button.active{color:#fff;background:linear-gradient(90deg,#6d4ed0,#4c3b9f);box-shadow:0 7px 18px #0002}.nav-icon{width:20px;text-align:center;font-size:16px}.sidebar-foot{margin-top:auto;padding:16px 12px;color:#9ca6c1;font-size:12px;border-top:1px solid #ffffff16}.main{width:calc(100% - 260px);margin-left:260px;min-height:100vh}.topbar{height:78px;background:#ffffffdd;backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:10}.topbar-left{display:flex;align-items:center;gap:14px}.topbar h1{font-size:21px;margin:0}.mobile-menu{display:none;border:0;background:transparent;font-size:22px}.topbar-right{display:flex;align-items:center;gap:16px}.greeting{color:var(--muted)}.bell{position:relative;border:0;background:#f1efff;color:var(--purple);width:38px;height:38px;border-radius:12px}.bell:after{content:"";position:absolute;width:7px;height:7px;background:#ef476f;border:2px solid white;border-radius:50%;right:8px;top:7px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e9e2ff;color:var(--purple);font-weight:800}.content{padding:30px 34px 48px;max-width:1500px;margin:auto}.module{display:none;animation:fade .22s ease}.module.active{display:block}@keyframes fade{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}.eyebrow{text-transform:uppercase;letter-spacing:.13em;color:var(--purple);font-weight:800;font-size:11px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:center;background:linear-gradient(120deg,#f0ecff,#fff 54%,#eef5ff);border:1px solid #e9e1ff;border-radius:24px;padding:28px 30px;margin-bottom:22px}.hero h2{font-size:30px;line-height:1.15;margin:5px 0 8px}.hero p{color:var(--muted);margin:0}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 16px;font-weight:750;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{transform:translateY(-1px);filter:brightness(.98)}.btn-primary{background:linear-gradient(135deg,var(--purple-2),var(--purple));color:#fff;box-shadow:0 8px 18px #6941c633}.btn-secondary{background:#fff;border:1px solid #ddd6fe;color:var(--purple)}.btn-ghost{background:#f5f6fa;color:#3f4b65}.btn-danger{background:#fff0ef;color:var(--red)}.btn-success{background:#e8f8f0;color:#087443}.btn-small{padding:7px 10px;font-size:12px;border-radius:9px}.grid{display:grid;gap:18px}.stats{grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:22px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.stat{min-height:120px}.stat-label{color:var(--muted);font-size:12px;font-weight:700}.stat-value{font-size:28px;font-weight:850;margin:12px 0 2px}.stat-foot{font-size:12px;color:var(--muted)}.stat-button{width:100%;text-align:left;border:0;background:none;padding:0}.layout-2{grid-template-columns:1.3fr .7fr}.layout-3{grid-template-columns:repeat(3,1fr)}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.section-title h3{margin:0;font-size:17px}.section-title p{margin:0;color:var(--muted);font-size:12px}.chart-wrap{height:260px;position:relative}.chart-wrap canvas{width:100%;height:100%}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.table td{font-size:13px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;background:#eef0f7;color:#4a5570}.pill.green{background:#e8f8f0;color:#087443}.pill.amber{background:#fff5e6;color:#a15c00}.pill.red{background:#fff0ef;color:#b42318}.pill.purple{background:#f0ebff;color:#5b35b6}.progress{height:8px;background:#edf0f5;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--purple-2),var(--blue));border-radius:inherit}.subject-card{display:grid;gap:12px}.subject-head{display:flex;justify-content:space-between;font-weight:800}.subject-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.activity{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.activity:last-child{border:0}.activity-dot{width:9px;height:9px;background:var(--purple-2);border-radius:50%;margin-top:6px;flex:none}.activity p{margin:0}.activity small{color:var(--muted)}.empty{text-align:center;padding:28px;color:var(--muted);border:1px dashed #cfd4df;border-radius:14px;background:#fbfcfe}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800;color:#3f4b65}.field input,.field select,.field textarea{width:100%;border:1px solid #d9ddea;background:#fff;border-radius:11px;padding:11px 12px;color:var(--ink);outline:none}.field textarea{min-height:96px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple-2);box-shadow:0 0 0 3px #8b5cf622}.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:18px}.toolbar .field{min-width:150px}.question-card{max-width:900px;margin:auto}.question-top{display:flex;justify-content:space-between;gap:12px;align-items:center;color:var(--muted);font-size:12px}.question-card h2{font-size:24px;line-height:1.3;margin:22px 0}.options{display:grid;gap:10px}.option{display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);padding:14px;border-radius:13px;background:#fff;text-align:left;width:100%;color:var(--ink)}.option:hover{border-color:#a78bfa;background:#fbfaff}.option.selected{border-color:var(--purple);background:#f4f0ff;box-shadow:0 0 0 2px #8b5cf633}.option b{width:25px;height:25px;display:grid;place-items:center;border-radius:50%;background:#eef0f7;color:#58647c;flex:none}.option.selected b{background:var(--purple);color:#fff}.question-nav{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.q-indicator{border:0;background:#eef0f7;color:#58647c;width:32px;height:32px;border-radius:9px;font-weight:800}.q-indicator.answered{background:#d9f8ea;color:#087443}.q-indicator.current{outline:3px solid #c4b5fd}.result-score{text-align:center;background:linear-gradient(135deg,#f0ebff,#eef5ff);padding:24px;border-radius:18px}.score-ring{font-size:52px;font-weight:900;color:var(--purple);line-height:1}.result-grid{grid-template-columns:repeat(4,1fr);margin:18px 0}.notice{padding:12px 14px;border-radius:11px;background:#f5f6fa;color:#4b5871;font-size:13px}.notice.info{background:#eff6ff;color:#1d4ed8}.notice.warn{background:#fff8eb;color:#a15c00}.notice.success{background:#e8f8f0;color:#087443}.task{display:flex;justify-content:space-between;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.task:last-child{border:0}.task-main{min-width:0}.task-main h4{margin:0 0 3px}.task-main p{margin:0;color:var(--muted);font-size:12px}.task.done h4{text-decoration:line-through;color:#75809a}.task.done{opacity:.7}.task-actions{display:flex;gap:7px;flex:none}.recommendation{border-left:4px solid var(--purple);display:grid;gap:10px}.recommendation.high{border-color:var(--red)}.recommendation.medium{border-color:var(--amber)}.recommendation h4{margin:0;font-size:16px}.recommendation p{margin:0;color:var(--muted)}.rec-head{display:flex;justify-content:space-between;gap:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.settings-box{display:grid;gap:12px}.footer-note{margin-top:22px;color:var(--muted);font-size:12px;text-align:center}.toast-region{position:fixed;right:22px;bottom:22px;z-index:50;display:grid;gap:10px;max-width:min(360px,calc(100vw - 40px))}.toast{background:#172033;color:#fff;border-left:4px solid var(--purple-2);padding:13px 15px;border-radius:12px;box-shadow:0 10px 25px #0003;animation:toast .22s ease}.toast.error{border-color:#ff6b6b}.toast.success{border-color:#36d399}@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.modal-backdrop{display:none;position:fixed;inset:0;background:#11182799;z-index:60;place-items:center;padding:18px}.modal-backdrop.open{display:grid}.modal{width:min(500px,100%);background:#fff;border-radius:18px;box-shadow:0 25px 80px #0004;padding:24px}.modal h3{margin:0 0 8px}.modal p{color:var(--muted);margin:0 0 20px}.modal-actions{display:flex;justify-content:flex-end;gap:9px}.dark{--bg:#0e1324;--card:#171d32;--ink:#eef1fb;--muted:#aeb7ce;--line:#2a3452}.dark .topbar{background:#11172bdd}.dark .hero{background:linear-gradient(120deg,#211e45,#171d32)}.dark .card,.dark .option,.dark .field input,.dark .field select,.dark .field textarea,.dark .modal{background:#171d32;color:var(--ink)}.dark .btn-secondary,.dark .btn-ghost{background:#202944}.dark .progress,.dark .q-indicator{background:#2a3452}.dark .table th,.dark .table td{border-color:#2a3452}.dark .empty{background:#141a2d;border-color:#35405e}@media(max-width:1180px){.stats{grid-template-columns:repeat(3,1fr)}.layout-2{grid-template-columns:1fr}.layout-3{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{transform:translateX(-100%);transition:.22s;box-shadow:15px 0 35px #0004}.sidebar.open{transform:none}.main{width:100%;margin-left:0}.topbar{padding:0 17px;height:68px}.mobile-menu{display:block}.topbar h1{font-size:18px}.greeting{display:none}.content{padding:20px 15px 35px}.hero{display:block;padding:21px}.hero h2{font-size:25px}.hero-actions{margin-top:18px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:15px;min-height:108px}.stat-value{font-size:23px}.layout-3,.two-col,.form-grid,.result-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.task{align-items:flex-start;display:block}.task-actions{margin-top:11px}.topbar-right{gap:8px}.card{padding:16px}.section-title{margin-top:22px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><span>StudyMind<em> AI</em></span></div>
      <nav class="nav" aria-label="Main navigation">
        <button data-nav="dashboard" class="active"><span class="nav-icon">⌂</span>Dashboard</button>
        <button data-nav="assessment"><span class="nav-icon">✓</span>Assessment</button>
        <button data-nav="profile"><span class="nav-icon">◉</span>Learner Profile</button>
        <button data-nav="plan"><span class="nav-icon">▤</span>Study Plan</button>
        <button data-nav="quiz"><span class="nav-icon">?</span>Quiz</button>
        <button data-nav="progress"><span class="nav-icon">↗</span>Progress</button>
        <button data-nav="recommendations"><span class="nav-icon">✧</span>Recommendations</button>
        <button data-nav="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-foot">ML understands the learner.<br>GenAI plans for the learner.<br><br><span id="storage-status">Local demo mode</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left"><button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button><h1 id="page-title">Dashboard</h1></div>
        <div class="topbar-right"><span class="greeting" id="top-greeting">Welcome back</span><button class="bell" aria-label="Notifications" data-nav="recommendations">♧</button><button class="avatar" id="avatar" data-nav="profile" aria-label="Open profile">A</button></div>
      </header>
      <div class="content">
        <section id="view-dashboard" class="module active"></section>
        <section id="view-assessment" class="module"></section>
        <section id="view-profile" class="module"></section>
        <section id="view-plan" class="module"></section>
        <section id="view-quiz" class="module"></section>
        <section id="view-progress" class="module"></section>
        <section id="view-recommendations" class="module"></section>
        <section id="view-settings" class="module"></section>
      </div>
    </main>
  </div>
  <div class="toast-region" id="toasts" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
  <script>
  (()=>{
    'use strict';
    const KEY='studymind-ai-standalone-v1';
    const subjects=['Python Programming','Mathematics','Statistics','Machine Learning','Data Structures','Database Management'];
    const questionBank=[
      {id:'py-loop',subject:'Python Programming',topic:'Loops',difficulty:'Easy',q:'Which keyword skips the current iteration of a Python loop?',options:['pass','continue','break','skip'],answer:1,explanation:'continue skips the rest of the current iteration and moves to the next one.'},
      {id:'py-fn',subject:'Python Programming',topic:'Functions',difficulty:'Medium',q:'What does a Python function return when it reaches the end without a return statement?',options:['0','False','None','An error'],answer:2,explanation:'Python functions implicitly return None when no return statement is executed.'},
      {id:'py-list',subject:'Python Programming',topic:'Data Types',difficulty:'Easy',q:'Which Python type is mutable?',options:['tuple','string','list','frozenset'],answer:2,explanation:'Lists can be changed after creation, while tuples and strings are immutable.'},
      {id:'math-algebra',subject:'Mathematics',topic:'Algebra',difficulty:'Easy',q:'If 3x + 6 = 18, what is x?',options:['2','4','6','8'],answer:1,explanation:'Subtract 6 and divide by 3: x = 4.'},
      {id:'math-calc',subject:'Mathematics',topic:'Calculus',difficulty:'Medium',q:'What is the derivative of x²?',options:['x','2x','x³','2'],answer:1,explanation:'The power rule gives 2x.'},
      {id:'math-prob',subject:'Mathematics',topic:'Probability',difficulty:'Easy',q:'What is the probability of rolling a 6 on a fair die?',options:['1/2','1/3','1/6','1/12'],answer:2,explanation:'One of six equally likely outcomes is a 6.'},
      {id:'stat-mean',subject:'Statistics',topic:'Descriptive Statistics',difficulty:'Easy',q:'What is the mean of 2, 4 and 6?',options:['3','4','5','6'],answer:1,explanation:'(2 + 4 + 6) / 3 = 4.'},
      {id:'stat-p',subject:'Statistics',topic:'Inference',difficulty:'Medium',q:'A small p-value usually provides evidence against which hypothesis?',options:['The alternative hypothesis','The null hypothesis','The sampling frame','The mean'],answer:1,explanation:'A small p-value suggests the observed data would be unlikely under the null hypothesis.'},
      {id:'stat-spread',subject:'Statistics',topic:'Variability',difficulty:'Easy',q:'Which measure describes the spread of values around the mean?',options:['Median','Standard deviation','Mode','Count'],answer:1,explanation:'Standard deviation measures typical distance from the mean.'},
      {id:'ml-overfit',subject:'Machine Learning',topic:'Model Evaluation',difficulty:'Medium',q:'A model that performs well on training data but poorly on unseen data is likely…',options:['Underfit','Overfit','Regularized','Normalized'],answer:1,explanation:'Overfitting occurs when a model memorizes training patterns and generalizes poorly.'},
      {id:'ml-split',subject:'Machine Learning',topic:'Model Evaluation',difficulty:'Easy',q:'Why is a test set used?',options:['To tune every parameter','To estimate generalization','To increase training size','To remove labels'],answer:1,explanation:'A held-out test set gives an unbiased estimate of performance on unseen examples.'},
      {id:'ml-precision',subject:'Machine Learning',topic:'Metrics',difficulty:'Medium',q:'Precision is the fraction of predicted positives that are…',options:['Actually positive','Actually negative','All examples','Missing'],answer:0,explanation:'Precision = true positives / (true positives + false positives).'},
      {id:'ds-stack',subject:'Data Structures',topic:'Stacks and Queues',difficulty:'Easy',q:'Which principle does a stack follow?',options:['FIFO','LIFO','Random access','Priority first'],answer:1,explanation:'A stack is last-in, first-out (LIFO).'},
      {id:'ds-big-o',subject:'Data Structures',topic:'Complexity',difficulty:'Medium',q:'Binary search on a sorted array has average time complexity…',options:['O(n²)','O(n)','O(log n)','O(1)'],answer:2,explanation:'Each comparison halves the remaining search space.'},
      {id:'ds-tree',subject:'Data Structures',topic:'Trees',difficulty:'Easy',q:'In a binary tree, each node has at most how many children?',options:['1','2','3','Unlimited'],answer:1,explanation:'A binary tree node has at most a left and a right child.'},
      {id:'db-key',subject:'Database Management',topic:'Relational Design',difficulty:'Easy',q:'What uniquely identifies a row in a relational table?',options:['Foreign key','Primary key','Index page','View'],answer:1,explanation:'A primary key uniquely identifies each row.'},
      {id:'db-normal',subject:'Database Management',topic:'Normalization',difficulty:'Medium',q:'Normalization primarily helps reduce…',options:['Data redundancy','Query meaning','Column names','Backups'],answer:0,explanation:'Normalization organizes data to reduce unnecessary duplication and update anomalies.'},
      {id:'db-sql',subject:'Database Management',topic:'SQL',difficulty:'Easy',q:'Which SQL clause filters rows?',options:['ORDER BY','GROUP BY','WHERE','JOIN'],answer:2,explanation:'WHERE filters rows before grouping or ordering.'}
    ];
    const titles={dashboard:'Dashboard',assessment:'Assessment',profile:'Learner Profile',plan:'Study Plan',quiz:'Quiz',progress:'Progress & Analytics',recommendations:'Recommendations',settings:'Settings'};
    const defaultData=()=>({version:1,profile:{name:'Alex Student',email:'alex@example.com',academicYear:'Undergraduate',goals:'Build strong fundamentals and prepare for exams',subjects:['Python Programming','Mathematics'],learningStyle:'Mixed practice',dailyMinutes:60},assessmentAttempts:[],quizAttempts:[],studyPlans:[],studyTasks:[],activities:[],dismissedRecommendations:[],settings:{theme:'light'}});
    const clone=o=>JSON.parse(JSON.stringify(o));
    function normalize(raw){const d=defaultData();if(!raw||typeof raw!=='object')return d;for(const k of Object.keys(d)){if(raw[k]!==undefined)d[k]=raw[k]}d.profile={...d.profile,...(raw.profile||{})};d.profile.subjects=Array.isArray(d.profile.subjects)?raw.profile.subjects.filter(x=>subjects.includes(x)):d.profile.subjects;d.assessmentAttempts=Array.isArray(d.assessmentAttempts)?d.assessmentAttempts:[];d.quizAttempts=Array.isArray(d.quizAttempts)?d.quizAttempts:[];d.studyPlans=Array.isArray(d.studyPlans)?d.studyPlans:[];d.studyTasks=Array.isArray(d.studyTasks)?d.studyTasks:[];d.activities=Array.isArray(d.activities)?d.activities:[];d.dismissedRecommendations=Array.isArray(d.dismissedRecommendations)?d.dismissedRecommendations:[];d.settings={...defaultData().settings,...(raw.settings||{})};return d}
    function load(){try{return normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){return defaultData()}}
    let data=load();
    const current={module:'dashboard',assessment:null,quiz:null,assessmentResult:null,quizResult:null,planSubject:'all',planStatus:'all',progressSubject:'all',progressType:'all',progressDays:'all'};
    const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const uid=p=>p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
    const dateISO=d=>new Date(d||Date.now()).toISOString().slice(0,10);
    const fmtDate=d=>d?new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'—';
    const pct=n=>Number.isFinite(n)?Math.round(n)+'%':'—';
    const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));$('#storage-status').textContent='Saved locally · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};
    const initials=n=>String(n||'A').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
    function toast(message,type='success'){const el=document.createElement('div');el.className='toast '+type;el.textContent=message;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3600)}
    function ask(title,message,confirmText='Confirm'){return new Promise(resolve=>{const box=$('#modal'),back=$('#modal-backdrop');box.innerHTML=`<h3>${esc(title)}</h3><p>${esc(message)}</p><div class="modal-actions"><button class="btn btn-ghost" data-modal="cancel">Cancel</button><button class="btn btn-primary" data-modal="confirm">${esc(confirmText)}</button></div>`;back.classList.add('open');box.querySelector('[data-modal="confirm"]').focus();box._resolve=ok=>{back.classList.remove('open');resolve(ok)}})}
    function info(title,message){const box=$('#modal'),back=$('#modal-backdrop');box.innerHTML=`<h3>${esc(title)}</h3><p>${esc(message)}</p><div class="modal-actions"><button class="btn btn-primary" data-modal="close">Close</button></div>`;back.classList.add('open')}
    function metrics(){const aa=data.assessmentAttempts,qa=data.quizAttempts;const avg=a=>a.length?a.reduce((s,x)=>s+(Number(x.percentage)||0),0)/a.length:null;const done=data.studyTasks.filter(x=>x.status==='completed').length;const topics=new Set();[...aa,...qa].forEach(x=>(x.weakTopics||[]).forEach(t=>topics.add(t)));return{assessmentAvg:avg(aa),quizAvg:avg(qa),assessments:aa.length,quizzes:qa.length,taskPct:data.studyTasks.length?done/data.studyTasks.length*100:null,weakTopics:topics.size,done,tasks:data.studyTasks.length}}
    function recordActivity(text,type='general'){data.activities.unshift({id:uid('act'),text,type,date:new Date().toISOString()});data.activities=data.activities.slice(0,30)}
    function topicStats(){const all=[...data.assessmentAttempts,...data.quizAttempts],map={};all.forEach(a=>(a.details||[]).forEach(d=>{const key=d.topic||'General';map[key]??={sum:0,count:0,subject:d.subject};map[key].sum+=(d.correct?100:0);map[key].count++}));return Object.entries(map).map(([topic,x])=>({topic,subject:x.subject,score:x.sum/x.count,count:x.count})).sort((a,b)=>a.score-b.score)}
    function weakTopics(){return topicStats().filter(x=>x.score<70).map(x=>x.topic)}
    function subjectStats(){const map={};[...data.assessmentAttempts,...data.quizAttempts].forEach(a=>{map[a.subject]??=[];map[a.subject].push(a.percentage)});return subjects.map(s=>{const vals=map[s]||[];return{name:s,score:vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:null,count:vals.length}})}
    function nav(module){current.module=module;current.assessment=null;current.quiz=null;$('#page-title').textContent=titles[module];$$('.module').forEach(x=>x.classList.toggle('active',x.id==='view-'+module));$$('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===module));renderModule();$('#sidebar').classList.remove('open');window.scrollTo({top:0,behavior:'smooth'})}
    function renderModule(){switch(current.module){case'dashboard':renderDashboard();break;case'assessment':renderAssessment();break;case'profile':renderProfile();break;case'plan':renderPlan();break;case'quiz':renderQuiz();break;case'progress':renderProgress();break;case'recommendations':renderRecommendations();break;case'settings':renderSettings();break}updateTop()}

    function statCard(label,value,foot,module){return`<button class="card stat stat-button" data-nav="${module||''}"><span class="stat-label">${esc(label)}</span><strong class="stat-value">${value}</strong><span class="stat-foot">${esc(foot)}</span></button>`}
    function renderDashboard(){const m=metrics(), name=esc(data.profile.name||'Learner'), today=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}), pending=data.studyTasks.filter(x=>x.status!=='completed').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5), subs=subjectStats();$('#view-dashboard').innerHTML=`<div class="hero"><div><span class="eyebrow">${today}</span><h2>Welcome back, ${name} 👋</h2><p>${m.assessments||m.quizzes?'Keep building momentum — your next focused session is within reach.':'Start with a quick assessment to personalize your first plan.'}</p></div><div class="hero-actions"><button class="btn btn-primary" data-action="open-assessment">Start Assessment</button><button class="btn btn-secondary" data-action="generate-plan">Generate Study Plan</button></div></div><div class="grid stats">${statCard('Assessment average',m.assessmentAvg==null?'—':pct(m.assessmentAvg),m.assessments+' completed','progress')}${statCard('Quiz average',m.quizAvg==null?'—':pct(m.quizAvg),m.quizzes+' completed','progress')}${statCard('Assessments completed',m.assessments,'Recorded attempts','assessment')}${statCard('Quizzes completed',m.quizzes,'Recorded attempts','quiz')}${statCard('Plan completion',m.taskPct==null?'—':pct(m.taskPct),m.done+' of '+m.tasks+' tasks','plan')}${statCard('Topics to improve',m.weakTopics,m.weakTopics?'Open recommendations':'No weak topics yet','recommendations')}</div><div class="grid layout-2"><div class="card"><div class="section-title"><div><h3>Performance overview</h3><p>Recorded scores over time</p></div><button class="btn btn-ghost btn-small" data-nav="progress">View analytics</button></div><div class="chart-wrap"><canvas id="dashboard-chart" aria-label="Performance chart"></canvas></div></div><div class="card"><div class="section-title"><div><h3>Plan completion</h3><p>${m.tasks?m.done+' completed of '+m.tasks:'No tasks yet'}</p></div><span class="pill purple">Live</span></div><div style="font-size:42px;font-weight:900;color:var(--purple);margin:20px 0">${m.taskPct==null?'—':pct(m.taskPct)}</div><div class="progress"><i style="width:${m.taskPct||0}%"></i></div><p class="stat-foot" style="margin-top:12px">Generate a plan from your profile, goals and weak topics.</p><button class="btn btn-secondary btn-small" data-nav="plan">Open study plan</button></div></div><div class="section-title"><div><h3>Subject overview</h3><p>Performance calculated from completed attempts</p></div></div><div class="grid layout-3">${subs.map(s=>`<div class="card subject-card"><div class="subject-head"><span>${esc(s.name)}</span><span>${s.score==null?'—':pct(s.score)}</span></div><div class="progress"><i style="width:${s.score||0}%"></i></div><div class="subject-meta"><span>${s.count?s.count+' attempt'+(s.count>1?'s':''):'No attempts'}</span><span>${s.score==null?'Start learning':s.score>=80?'Strong':'Needs practice'}</span></div></div>`).join('')}</div><div class="grid layout-2"><div><div class="section-title"><div><h3>Recent activity</h3><p>Your latest learning actions</p></div></div><div class="card">${data.activities.length?data.activities.slice(0,6).map(a=>`<div class="activity"><i class="activity-dot"></i><div><p>${esc(a.text)}</p><small>${fmtDate(a.date)}</small></div></div>`).join(''):'<div class="empty">Your completed assessments, quizzes and tasks will appear here.</div>'}</div></div><div><div class="section-title"><div><h3>Upcoming tasks</h3><p>Next scheduled study sessions</p></div></div><div class="card">${pending.length?pending.map(t=>`<div class="activity"><i class="activity-dot"></i><div><p><strong>${esc(t.topic)}</strong> · ${esc(t.subject)}</p><small>${fmtDate(t.date)} · ${t.minutes} min</small></div></div>`).join(''):'<div class="empty">No pending tasks. Generate a study plan to get started.</div>'}</div></div></div>`;drawDashboardChart()}
    function drawDashboardChart(){const vals=[...data.assessmentAttempts,...data.quizAttempts].sort((a,b)=>a.date.localeCompare(b.date)).slice(-8);drawLine('dashboard-chart',vals.map(x=>x.percentage),vals.map(x=>x.date),['#6941c6','#2563eb'])}
    function renderAssessment(){const el=$('#view-assessment');if(current.assessment){renderAssessmentSession();return}if(current.assessmentResult){renderAssessmentResult();return}el.innerHTML=`<div class="section-title"><div><span class="eyebrow">Diagnostic learning check</span><h3>Assessment</h3><p>Find strengths and weak topics with a saved, explainable assessment.</p></div></div><div class="card"><div class="notice info">This standalone version evaluates a curated question bank locally. No backend or AI service is required.</div><form id="assessment-form" class="form-grid" style="margin-top:20px"><div class="field"><label for="assessment-subject">Subject</label><select id="assessment-subject">${subjects.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="assessment-topic">Topic</label><select id="assessment-topic"><option value="all">All topics</option>${[...new Set(questionBank.map(q=>q.topic))].map(t=>`<option>${t}</option>`).join('')}</select></div><div class="field"><label for="assessment-difficulty">Difficulty</label><select id="assessment-difficulty"><option value="all">Mixed difficulty</option><option>Easy</option><option>Medium</option></select></div><div class="field"><label for="assessment-count">Questions</label><select id="assessment-count"><option>5</option><option>8</option><option>10</option></select></div><div class="form-actions field full"><button class="btn btn-primary" type="submit">Start Assessment →</button></div></form></div><div class="section-title"><div><h3>Previous attempts</h3><p>Review your saved results</p></div></div><div class="card table-wrap">${attemptTable(data.assessmentAttempts,'assessment')}</div>`}
    function attemptTable(arr,type){if(!arr.length)return'<div class="empty">No completed attempts yet. Your results will appear here.</div>';return`<table class="table"><thead><tr><th>Date</th><th>Subject</th><th>Score</th><th>Questions</th><th>Topics to revisit</th></tr></thead><tbody>${arr.slice(0,12).map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${esc(a.subject)}</td><td><span class="pill ${a.percentage>=80?'green':a.percentage<60?'red':'amber'}">${pct(a.percentage)}</span></td><td>${a.correct}/${a.total}</td><td>${esc((a.weakTopics||[]).join(', ')||'None')}</td></tr>`).join('')}</tbody></table>`}
    function sessionHtml(session,type){const q=session.questions[session.index],answers=session.answers;return`<div class="section-title"><div><span class="eyebrow">${type==='assessment'?'Diagnostic assessment':'Practice quiz'}</span><h3>${esc(q.subject)}</h3><p>${esc(q.topic)} · ${esc(q.difficulty)}</p></div><span class="pill purple">${session.index+1} / ${session.questions.length}</span></div><div class="card question-card"><div class="question-top"><span>Question ${session.index+1}</span><span>${Math.round((session.index+1)/session.questions.length*100)}% progress</span></div><div class="progress" style="margin-top:10px"><i style="width:${(session.index+1)/session.questions.length*100}%"></i></div><h2>${esc(q.q)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${answers[session.index]===i?'selected':''}" data-answer="${i}" data-type="${type}"><b>${String.fromCharCode(65+i)}</b><span>${esc(o)}</span></button>`).join('')}</div><div class="question-nav">${session.questions.map((_,i)=>`<button class="q-indicator ${answers[i]!=null?'answered':''} ${i===session.index?'current':''}" data-question="${i}" data-type="${type}">${i+1}</button>`).join('')}</div><div class="form-actions" style="justify-content:space-between"><button class="btn btn-ghost" data-action="prev-question" data-type="${type}" ${session.index===0?'disabled':''}>← Previous</button>${session.index<session.questions.length-1?`<button class="btn btn-primary" data-action="next-question" data-type="${type}">Next →</button>`:`<button class="btn btn-primary" data-action="submit-${type}">Submit ${type==='assessment'?'Assessment':'Quiz'}</button>`}</div></div>`}

d||'Not answered')} · Correct: ${esc(d.correctAnswer)}<br><small>${esc(d.explanation)}</small></div>`).join('')}`:''}</div>`}
    function startAssessment(form){const subject=$('#assessment-subject').value,topic=$('#assessment-topic').value,diff=$('#assessment-difficulty').value,count=Number($('#assessment-count').value);let qs=questionBank.filter(q=>q.subject===subject&&(topic==='all'||q.topic===topic)&&(diff==='all'||q.difficulty===diff));if(qs.length<count)qs=questionBank.filter(q=>q.subject===subject);qs=shuffle(qs).slice(0,Math.min(count,qs.length));if(!qs.length){toast('No questions match those filters.','error');return}current.assessment={questions:qs,answers:Array(qs.length).fill(null),index:0};renderAssessmentSession()}
    function finishSession(type){const s=current[type], unanswered=s.answers.filter(x=>x==null).length;if(unanswered&&!(window._allowSubmit)){ask('Submit with unanswered questions?',`You have ${unanswered} unanswered question${unanswered>1?'s':''}. You can still submit and review them.`,'Submit').then(ok=>{if(ok){window._allowSubmit=true;finishSession(type)}});return}window._allowSubmit=false;const details=s.questions.map((q,i)=>({question:q.q,subject:q.subject,topic:q.topic,selected:s.answers[i]==null?'':q.options[s.answers[i]],correctAnswer:q.options[q.answer],correct:s.answers[i]===q.answer,explanation:q.explanation})),correct=details.filter(x=>x.correct).length,grouped={};details.forEach(x=>{grouped[x.topic]??={subject:x.subject,total:0,correct:0};grouped[x.topic].total++;if(x.correct)grouped[x.topic].correct++});const attempt={id:uid(type),date:new Date().toISOString(),subject:s.questions[0].subject,total:s.questions.length,correct,incorrect:details.filter(x=>x.selected&&!x.correct).length,unanswered,percentage:correct/s.questions.length*100,weakTopics:[...new Set(details.filter(x=>!x.correct).map(x=>x.topic))],strongTopics:[...new Set(details.filter(x=>x.correct).map(x=>x.topic))],topicStats:Object.entries(grouped).map(([topic,x])=>({topic,subject:x.subject,total:x.total,correct:x.correct,score:x.correct/x.total*100})),details};if(type==='assessment'){data.assessmentAttempts.unshift(attempt);current.assessmentResult=attempt;current.assessment=null;recordActivity(`Completed an assessment in ${attempt.subject} with ${pct(attempt.percentage)}.`,'assessment')}else{data.quizAttempts.unshift(attempt);current.quizResult=attempt;current.quiz=null;recordActivity(`Completed a quiz in ${attempt.subject} with ${pct(attempt.percentage)}.`,'quiz')}save();toast(type==='assessment'?'Assessment submitted successfully.':'Quiz completed successfully.');renderModule()}

    function startQuiz(){const subject=$('#quiz-subject').value,topic=$('#quiz-topic').value,diff=$('#quiz-difficulty').value,count=Number($('#quiz-count').value);let qs=questionBank.filter(q=>q.subject===subject&&(topic==='all'||q.topic===topic)&&(diff==='all'||q.difficulty===diff));if(qs.length<count)qs=questionBank.filter(q=>q.subject===subject);qs=shuffle(qs).slice(0,Math.min(count,qs.length));current.quiz={questions:qs,answers:Array(qs.length).fill(null),index:0};renderQuiz()}
    function renderProfile(){const p=data.profile,m=metrics();$('#view-profile').innerHTML=`<div class="section-title"><div><span class="eyebrow">Your learning context</span><h3>Learner Profile</h3><p>StudyMind uses this information to shape local study-plan suggestions.</p></div></div><div class="grid two-col"><div class="card"><form id="profile-form" class="form-grid"><div class="field"><label for="profile-name">Full name</label><input id="profile-name" required maxlength="80" value="${esc(p.name)}"></div><div class="field"><label for="profile-email">Email</label><input id="profile-email" type="email" required value="${esc(p.email)}"></div><div class="field"><label for="profile-year">Academic year</label><select id="profile-year">${['High school','Undergraduate','Postgraduate','Professional learner'].map(x=>`<option ${p.academicYear===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="profile-style">Preferred learning style</label><select id="profile-style">${['Mixed practice','Visual explanations','Reading and notes','Practice first'].map(x=>`<option ${p.learningStyle===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field full"><label>Subjects of interest</label><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">${subjects.map(s=>`<label style="font-weight:500"><input type="checkbox" name="profile-subject" value="${s}" ${p.subjects.includes(s)?'checked':''}> ${s}</label>`).join('')}</div></div><div class="field full"><label for="profile-goals">Learning goals</label><textarea id="profile-goals" maxlength="500">${esc(p.goals)}</textarea></div><div class="field"><label for="profile-time">Daily study time (minutes)</label><input id="profile-time" type="number" min="15" max="720" step="15" value="${Number(p.dailyMinutes)||60}"></div><div class="form-actions field full"><button class="btn btn-primary" type="submit">Save profile</button><button class="btn btn-danger" type="button" data-action=     function renderPlan(){const filtered=data.studyTasks.filter(t=>(current.planSubject==='all'||t.subject===current.planSubject)&&(current.planStatus==='all'||t.status===current.planStatus));const m=metrics();$('#view-plan').innerHTML=`<div class="section-title"><div><span class="eyebrow">Personalized local planner</span><h3>Study Plan</h3><p>Rules use your profile, results, weak topics and available time.</p></div><button class="btn btn-primary" data-action="generate-plan">${data.studyTasks.length?'Regenerate plan':'Generate study plan'}</button></div><div class="grid layout-3"><div class="card"><span class="stat-label">Completion</span><strong class="stat-value">${m.taskPct==null?'—':pct(m.taskPct)}</strong><div class="progress"><i style="width:${m.taskPct||0}%"></i></div></div><div class="card"><span class="stat-label">Pending tasks</span><strong class="stat-value">${data.studyTasks.filter(t=>t.status!=='completed').length}</strong><span class="stat-foot">Ordered by scheduled day</span></div><div class="card"><span class="stat-label">Focus topics</span><strong class="stat-value">${weakTopics().length||'—'}</strong><span class="stat-foot">Based on recorded answers</span></div></div><div class="card" style="margin-top:18px"><div class="toolbar"><div class="field"><label for="plan-subject">Filter subject</label><select id="plan-subject"><option value="all">All subjects</option>${subjects.map(s=>`<option ${current.planSubject===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="plan-status">Filter status</label><select id="plan-status"><option value="all">All statuses</option><option value="pending" ${current.planStatus==='pending'?'selected':''}>Pending</option><option value="completed" ${current.planStatus==='completed'?'selected':''}>Completed</option></select></div></div>${filtered.length?filtered.map(taskHtml).join(''):'<div class="empty">No tasks match this view. Generate a plan using your profile and learning goals.</div>'}</div>`}
    function taskHtml(t){return`<div class="task ${t.status==='completed'?'done':''}"><div class="task-main"><h4>${esc(t.topic)} <span class="pill ${t.priority==='High'?'red':t.priority==='Medium'?'amber':'green'}">${esc(t.priority)}</span></h4><p>${esc(t.subject)} · ${esc(t.objective)} · ${t.minutes} min · ${fmtDate(t.date)}</p><p>${esc(t.activity)}</p></div><div class="task-actions"><button class="btn btn-small ${t.status==='completed'?'btn-ghost':'btn-success'}" data-task="toggle" data-id="${t.id}">${t.status==='completed'?'Reopen':'Complete'}</button><button class="btn btn-small btn-ghost" data-task="details" data-id="${t.id}">Details</button><button class="btn btn-small btn-danger" data-task="delete" data-id="${t.id}" aria-label="Delete task">×</button></div></div>`}
    function generatePlan(){const chosen=data.profile.subjects.length?data.profile.subjects:subjects.slice(0,2),weak=weakTopics(),existing=data.studyTasks.filter(t=>t.status==='completed'),tasks=[],activities=['Review a focused concept','Solve guided practice problems','Create a one-page summary','Attempt a timed mini-quiz','Explain the topic in your own words','Use retrieval practice flashcards'];for(let i=0;i<Math.max(6,chosen.length*3);i++){const subject=chosen[i%chosen.length],bank=questionBank.filter(q=>q.subject===subject),topic=weak[i%weak.length]||bank[i%bank.length]?.topic||'Fundamentals',priority=weak.includes(topic)?'High':i<chosen.length*2?'Medium':'Low';tasks.push({id:uid('task'),subject,topic,objective:`Build confidence in ${topic}`,activity:activities[i%activities.length],priority,minutes:Math.max(20,Math.round((Number(data.profile.dailyMinutes)||60)/(i%2?2:1)/5)*5),date:dateISO(Date.now()+(i+1)*86400000),status:'pending',created:new Date().toISOString()})}data.studyTasks=[...existing,...tasks];data.studyPlans.unshift({id:uid('plan'),date:new Date().toISOString(),taskIds:tasks.map(t=>t.id),source:'local JavaScript planner'});data.studyPlans=data.studyPlans.slice(0,10);recordActivity(`Generated a ${tasks.length}-task study plan from your profile and learning data.`,'plan');save();toast('Study plan generated successfully.');nav('plan')}
    function renderProgress(){const subjectFilter=current.progressSubject,type=current.progressType;let aa=data.assessmentAttempts,qa=data.quizAttempts;if(subjectFilter!=='all'){aa=aa.filter(a=>a.subject===subjectFilter);qa=qa.filter(a=>a.subject===subjectFilter)}if(type==='assessment')qa=[];if(type==='quiz')aa=[];const all=[...aa,...qa].sort((a,b)=>a.date.localeCompare(b.date)),m=metrics(),ts=topicStats();$('#view-progress').innerHTML=`<div class="section-title"><div><span class="eyebrow">Evidence over time</span><h3>Progress & Analytics</h3><p>Every value below is calculated from saved attempts and tasks.</p></div></div><div class="grid stats">${statCard('Assessment average',m.assessmentAvg==null?'—':pct(m.assessmentAvg),m.assessments+' attempts','assessment')}${statCard('Quiz average',m.quizAvg==null?'—':pct(m.quizAvg),m.quizzes+' attempts','quiz')}${statCard('Study tasks',m.taskPct==null?'—':pct(m.taskPct),m.done+' of '+m.tasks+' completed','plan')}${statCard('Strong topics',ts.filter(x=>x.score>=80).length,'At least 80%','recommendations')}${statCard('Weak topics',ts.filter(x=>x.score<70).length,'Below 70%','recommendations')}${statCard('Activity records',data.activities.length,'Saved locally','settings')}</div><div class="card"><div class="toolbar"><div class="field"><label for="progress-subject">Subject</label><select id="progress-subject"><option value="all">All subjects</option>${subjects.map(s=>`<option ${subjectFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="progress-type">Record type</label><select id="progress-type"><option value="all" ${type==='all'?'selected':''}>Assessment + quiz</option><option value="assessment" ${type==='assessment'?'selected':''}>Assessment only</option><option value="quiz" ${type==='quiz'?'selected':''}>Quiz only</option></select></div></div><div class="chart-wrap"><canvas id="progress-chart" aria-label="Progress chart"></canvas></div></div><div class="grid two-col" style="margin-top:18px"><div class="card"><div class="section-title"><div><h3>Subject performance</h3></div></div>${subjectStats().map(s=>`<div style="margin:14px 0"><div class="subject-meta"><span>${esc(s.name)}</span><strong>${s.score==null?'No data':pct(s.score)}</strong></div><div class="progress" style="margin-top:7px"><i style="width:${s.score||0}%"></i></div></div>`).join('')}</div><div class="card"><div class="section-title"><div><h3>Topic performance</h3></div></div>${ts.length?ts.slice(0,10).map(t=>`<div style="margin:12px 0"><div class="subject-meta"><span>${esc(t.topic)} · ${esc(t.subject)}</span><strong>${pct(t.score)}</strong></div><div class="progress" style="margin-top:6px"><i style="width:${t.score}%"></i></div></div>`).join(''):'<div class="empty">No data available yet. Complete an assessment or quiz.</div>'}</div></div><div class="section-title"><div><h3>Attempt history</h3></div></div><div class="card table-wrap">${all.length?`<table class="table"><thead><tr><th>Date</th><th>Type</th><th>Subject</th><th>Score</th><th>Correct</th></tr></thead><tbody>${all.map(a=>`<tr><td>${fmtDate(a.date)}</td><td>${data.assessmentAttempts.includes(a)?'Assessment':'Quiz'}</td><td>${esc(a.subject)}</td><td>${pct(a.percentage)}</td><td>${a.correct}/${a.total}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No data available yet.</div>'}</div>`;drawLine('progress-chart',all.map(x=>x.percentage),all.map(x=>x.date),['#6941c6','#2563eb'])}
    function recommendations(){const out=[],ts=topicStats(),weak=ts.filter(x=>x.score<70).slice(0,4),strong=ts.filter(x=>x.score>=80).slice(-2),pending=data.studyTasks.filter(x=>x.status!=='completed');weak.forEach(t=>out.push({id:'weak-'+t.topic,title:`Strengthen ${t.topic}`,explanation:`Your recorded answers in ${t.topic} are at ${pct(t.score)}. A focused revision session followed by a short quiz can improve retention.`,subject:t.subject,topic:t.topic,priority:'High',action:'Start a related quiz',reason:'Derived from assessment and quiz topic accuracy.'}));if(pending.length)out.push({id:'pending-plan',title:'Continue your study plan',explanation:`You have ${pending.length} pending task${pending.length>1?'s':''}, starting with ${pending[0].topic}.`,subject:pending[0].subject,topic:pending[0].topic,priority:'Medium',action:'Open the next task',reason:'Derived from incomplete saved study tasks.'});strong.forEach(t=>out.push({id:'strong-'+t.topic,title:`Keep building on ${t.topic}`,explanation:`You are currently at ${pct(t.score)} in ${t.topic}. Try a more challenging question set to deepen mastery.`,subject:t.subject,topic:t.topic,priority:'Low',action:'Take a harder quiz',reason:'Derived from strong recorded performance.'}));if(!data.assessmentAttempts.length&&!data.quizAttempts.length)out.push({id:'start-baseline',title:'Create your baseline',explanation:'Complete a short assessment so the planner can identify strengths and focus areas.',subject:data.profile.subjects[0]||subjects[0],topic:'Fundamentals',priority:'Medium',action:'Start an assessment',reason:'No assessment or quiz records exist yet.'});return out.filter(x=>!data.dismissedRecommendations.includes(x.id))}
    function renderRecommendations(){$('#view-recommendations').innerHTML=`<div class="section-title"><div><span class="eyebrow">Explainable guidance</span><h3>Recommendations</h3><p>JavaScript rules use your saved profile, attempts and tasks — no AI claim is made.</p></div><button class="btn btn-ghost" data-action="reset-recommendations">Reset dismissed</button></div><div class="grid">${recommendations().length?recommendations().map(r=>`<div class="card recommendation ${r.priority.toLowerCase()}"><div class="rec-head"><div><span class="pill ${r.priority==='High'?'red':r.priority==='Medium'?'amber':'green'}">${r.priority} priority</span><h4 style="margin-top:9px">${esc(r.title)}</h4></div><button class="btn btn-small btn-ghost" data-rec="dismiss" data-id="${esc(r.id)}">Dismiss</button></div><p>${esc(r.explanation)}</p><div class="stat-foot"><strong>${esc(r.subject)}</strong> · ${esc(r.topic)} · ${esc(r.reason)}</div><div class="form-actions"><button class="btn btn-primary btn-small" data-rec="action" data-subject="${esc(r.subject)}" data-topic="${esc(r.topic)}">${esc(r.action)}</button><button class="btn btn-secondary btn-small" data-nav="progress">View performance</button></div></div>`).join(''):'<div class="empty">No active recommendations. Complete an assessment or quiz, or reset dismissed recommendations.</div>'}</div>`}
    function renderSettings(){$('#view-settings').innerHTML=`<div class="section-title"><div><span class="eyebrow">Your browser, your data</span><h3>Settings</h3><p>Manage appearance and move your learning records between browsers.</p></div></div><div class="grid two-col"><div class="card settings-box"><h3>Appearance</h3><div class="field"><label for="theme-select">Theme</label><select id="theme-select"><option value="light" ${data.settings.theme==='light'?'selected':''}>Light</option><option value="dark" ${data.settings.theme==='dark'?'selected':''}>Dark</option></select></div><div class="notice info">The standalone app works offline and stores records in localStorage. The original backend is not used.</div></div><div class="card settings-box"><h3>Backup and restore</h3><p class="stat-foot">Export includes your profile, attempts, tasks, activities, recommendations and settings.</p><div class="form-actions"><button class="btn btn-primary" data-action="export-data">Export JSON backup</button><button class="btn btn-secondary" data-action="import-data">Import JSON backup</button><input type="file" id="import-file" accept="application/json" hidden></div></div><div class="card settings-box"><h3>Reset learning progress</h3><p class="stat-foot">Removes attempts, tasks, activities and dismissed recommendations, but keeps your profile.</p><button class="btn btn-danger" data-action="reset-learning">Reset learning data</button></div><div class="card settings-box"><h3>Reset all application data</h3><p class="stat-foot">Returns StudyMind AI to its initial local demo state.</p><button class="btn btn-danger" data-action="reset-all">Reset everything</button></div></div>`}
    function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
    function updateSession(type,index){current[type].index=Math.max(0,Math.min(current[type].questions.length-1,index));renderModule()}
    function generateRecommendationsRefresh(){if(current.module==='recommendations')renderRecommendations()}
    function drawLine(id,values,labels,colors){const c=document.getElementById(id);if(!c)return;const rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1,w=Math.max(320,rect.width),h=Math.max(180,rect.height);c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);ctx.font='11px system-ui';ctx.fillStyle='#8a94a8';ctx.strokeStyle='#e8ebf2';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=24+i*(h-55)/4;ctx.beginPath();ctx.moveTo(38,y);ctx.lineTo(w-12,y);ctx.stroke();ctx.fillText(`${100-i*25}%`,4,y+4)}if(!values.length){ctx.fillStyle='#8a94a8';ctx.fillText('No data available yet',w/2-55,h/2);return}const max=100,min=0,x0=42,x1=w-18,y0=22,y1=h-35;ctx.strokeStyle=colors[0];ctx.lineWidth=3;ctx.lineJoin='round';ctx.beginPath();values.forEach((v,i)=>{const x=values.length===1?(x0+x1)/2:x0+i*(x1-x0)/(values.length-1),y=y1-(Math.max(min,Math.min(max,v))/100)*(y1-y0);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();values.forEach((v,i)=>{const x=values.length===1?(x0+x1)/2:x0+i*(x1-x0)/(values.length-1),y=y1-(Math.max(min,Math.min(max,v))/100)*(y1-y0);ctx.fillStyle=colors[i%colors.length];ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();if(labels[i]){ctx.fillStyle='#8a94a8';ctx.fillText(fmtDate(labels[i]).replace(/,.*$/,''),Math.max(38,x-14),h-12)}})}
    function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='studymind-backup-'+dateISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Data exported successfully.')}
    function validImport(x){return x&&typeof x==='object'&&x.profile&&Array.isArray(x.assessmentAttempts)&&Array.isArray(x.quizAttempts)&&Array.isArray(x.studyTasks)}
    function handleImport(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);if(!validImport(parsed)){toast('Import failed: this is not a StudyMind backup.','error');return}ask('Replace current records?','Importing will replace the profile and learning records currently saved in this browser.','Replace').then(ok=>{if(ok){data=normalize(parsed);save();toast('Backup imported successfully.');renderModule()}})}catch(e){toast('Import failed: invalid JSON file.','error')}};reader.readAsText(file)}
    function resetLearning(){data.assessmentAttempts=[];data.quizAttempts=[];data.studyPlans=[];data.studyTasks=[];data.activities=[];data.dismissedRecommendations=[];save();current.assessmentResult=null;current.quizResult=null;toast('Learning data reset.');renderModule()}
    document.addEventListener('click',e=>{const navBtn=e.target.closest('[data-nav]');if(navBtn){e.preventDefault();nav(navBtn.dataset.nav);return}const action=e.target.closest('[data-action]');if(action){const a=action.dataset.action;if(a==='open-assessment'){nav('assessment');return}if(a==='generate-plan'){generatePlan();return}if(a==='new-assessment'){current.assessmentResult=null;current.reviewAssessment=false;renderAssessment();return}if(a==='new-quiz'){current.quizResult=null;renderQuiz();return}if(a==='review-assessment'){current.reviewAssessment=!current.reviewAssessment;renderAssessment();return}if(a==='next-question'){updateSession(action.dataset.type,current[action.dataset.type].index+1);return}if(a==='prev-question'){updateSession(action.dataset.type,current[action.dataset.type].index-1);return}if(a==='submit-assessment'){finishSession('assessment');return}if(a==='submit-quiz'){finishSession('quiz');return}if(a==='reset-profile'){ask('Reset profile?','This will restore the default learner profile while keeping your learning records.','Reset').then(ok=>{if(ok){data.profile=defaultData().profile;save();toast('Profile reset.');renderProfile()}});return}if(a==='export-data'){exportData();return}if(a==='import-data'){$('#import-file').click();return}if(a==='reset-learning'){ask('Reset learning data?','Attempts, tasks, plans, activities and dismissed recommendations will be deleted.','Reset').then(ok=>{if(ok)resetLearning()});return}if(a==='reset-all'){ask('Reset everything?','All StudyMind data in this browser will be deleted. This cannot be undone.','Reset everything').then(ok=>{if(ok){data=defaultData();save();toast('All application data reset.');nav('dashboard')}});return}if(a==='reset-recommendations'){data.dismissedRecommendations=[];save();toast('Recommendations restored.');renderRecommendations();return}}
      const answer=e.target.closest('[data-answer]');if(answer){const type=answer.dataset.type,s=current[type];s.answers[s.index]=Number(answer.dataset.answer);renderModule();return}const q=e.target.closest('[data-question]');if(q){updateSession(q.dataset.type,Number(q.dataset.question));return}const task=e.target.closest('[data-task]');if(task){const t=data.studyTasks.find(x=>x.id===task.dataset.id);if(!t)return;if(task.dataset.task==='toggle'){t.status=t.status==='completed'?'pending':'completed';recordActivity(`${t.status==='completed'?'Completed':'Reopened'} study task: ${t.topic}.`,'task');save();toast(t.status==='completed'?'Task marked as completed.':'Task reopened.');renderModule();return}if(task.dataset.task==='delete'){ask('Delete this task?','The task will be removed from your study plan.','Delete').then(ok=>{if(ok){data.studyTasks=data.studyTasks.filter(x=>x.id!==t.id);save();toast('Task deleted.');renderModule()}});return}if(task.dataset.task==='details'){info(t.topic,`${t.subject} · ${t.priority} priority · ${t.minutes} minutes on ${fmtDate(t.date)}\n\nObjective: ${t.objective}\nActivity: ${t.activity}`);return}}
      const rec=e.target.closest('[data-rec]');if(rec){if(rec.dataset.rec==='dismiss'){data.dismissedRecommendations.push(rec.dataset.id);save();toast('Recommendation dismissed.');renderRecommendations()}else{const subject=rec.dataset.subject,topic=rec.dataset.topic;nav('quiz');setTimeout(()=>{const s=$('#quiz-subject');if(s){s.value=subject;$('#quiz-topic').value=topic;}},0)}return}
    });
    document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='assessment-form'){startAssessment(e.target);return}if(e.target.id==='quiz-form'){startQuiz();return}if(e.target.id==='profile-form'){const name=$('#profile-name').value.trim(),email=$('#profile-email').value.trim(),mins=Number($('#profile-time').value),checked=$$('input[name="profile-subject"]:checked').map(x=>x.value);if(name.length<2||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)||mins<15||mins>720||!checked.length){toast('Please complete the profile with valid values.','error');return}data.profile={...data.profile,name,email,academicYear:$('#profile-year').value,learningStyle:$('#profile-style').value,goals:$('#profile-goals').value.trim(),dailyMinutes:mins,subjects:checked};recordActivity('Updated learner profile.','profile');save();toast('Profile saved successfully.');renderProfile();updateTop()}});
    document.addEventListener('change',e=>{if(e.target.id==='plan-subject'){current.planSubject=e.target.value;renderPlan()}if(e.target.id==='plan-status'){current.planStatus=e.target.value;renderPlan()}if(e.target.id==='progress-subject'){current.progressSubject=e.target.value;renderProgress()}if(e.target.id==='progress-type'){current.progressType=e.target.value;renderProgress()}if(e.target.id==='theme-select'){data.settings.theme=e.target.value;save();updateTop();toast('Theme updated.');renderSettings()}if(e.target.id==='import-file')handleImport(e.target.files[0])});
    $('#mobile-menu').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
    $('#modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop'){$('#modal')._resolve?.(false)}});$('#modal').addEventListener('click',e=>{const b=e.target.closest('[data-modal]');if(!b)return;if($('#modal')._resolve){$('#modal')._resolve(b.dataset.modal==='confirm')}else $('#modal-backdrop').classList.remove('open')});
    window.addEventListener('resize',()=>{if(current.module==='dashboard')drawDashboardChart();if(current.module==='progress')drawLine('progress-chart',[...data.assessmentAttempts,...data.quizAttempts].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>x.percentage),[],['#6941c6'])});
    renderDashboard();updateTop();
  })();
  </script>
